{% load static %}
<!doctype html>
<html lang="en">
  <head>
  	<title>Login 10</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	
	<link rel="stylesheet" href="{% static 'changepassword/css/style.css' %}">

	</head>
	<body class="img js-fullheight" style="background-image: url('image/brooke-lark-V4MBq8kue3U-unsplash.jpg');">
	<section class="ftco-section">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-md-6 text-center mb-5">
					<h2 class="heading-section"></h2>
				</div>
			</div>
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-4">
					<div class="login-wrap p-0">
		      	<h3 class="mb-4 text-center">Change Password</h3>
		      	<form action="#" class="signin-form" method="post">
					{% csrf_token %}
		      		<div class="form-group">
						<span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
		      			<input type="text" class="form-control" name="t1" placeholder="Old Password" required>
		      		</div>
	            <div class="form-group">
	              <input id="password-field" type="password"  name="t2" class="form-control" placeholder="New Password" required>
	              <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
	            </div>
				<div class="form-group">
	              <input id="password-field" type="password" name="t3"  class="form-control" placeholder="Confirm Password" required>
	              <span toggle="#password-field" class="fa fa-fw fa-eye field-icon toggle-password"></span>
	            </div>
	            <div class="form-group">
	            	<button type="submit" class="form-control btn btn-primary submit px-3">Submit</button>
	            </div>
	            <div class="form-group d-md-flex">
	            	<div class="w-50">
		            	<label class="checkbox-wrap checkbox-primary">Remember Me
									  <input type="checkbox" checked>
									  <span class="checkmark"></span>
									</label>
								</div>
								<div class="w-50 text-md-right">
									<a href="#" style="color: #fff">Forgot Password</a>
								</div>
	            </div>
	          </form>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="{% static 'changepassword/js/jquery.min.js' %}"></script>
  <script src="{% static 'changepassword/js/popper.js' %}"></script>
  <script src="{% static 'changepassword/js/bootstrap.min.js' %}"></script>
  <script src="{% static 'changepassword/js/main.js' %}"></script>

	</body>
</html>
